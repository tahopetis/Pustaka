name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly baseline scan even with no changes.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build: the default autobuild would run `go build ./...`, which is
      # blocked by intentionally excluded test-harness packages (issues #4, #5).
      - name: Build (Go)
        if: matrix.language == 'go'
        run: go build $(go list -e ./... | grep -vE '/internal/(api|ci|auth)$|amortization_tests')

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
