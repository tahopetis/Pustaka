name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go build, vet, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: porta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d porta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/porta_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      # Every Go package and test suite is gated. Legacy suites that cannot
      # compile against the current API live in testdata/ (issues #4, #5).
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -p 1: the database-backed suites in different packages share one
      # Postgres/Redis instance and truncate it between tests.
      - name: Test
        run: go test -p 1 ./... -count=1

  frontend:
    name: Frontend unit tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npx vitest run

      - name: Build production bundle
        run: npm run build
