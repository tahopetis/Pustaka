name: go-deps

# Dependency bumps run here, on a GitHub-hosted runner, so no local Go
# toolchain is required (this repository is developed on a low-power arm64
# machine; CI is the build environment).
#
# WHY A PATCH INSTEAD OF A PULL REQUEST:
#   Commits pushed with the repository's GITHUB_TOKEN do not trigger workflows,
#   so a PR opened that way could never satisfy the required status checks
#   (`Dependency review`, CodeQL, image builds) and would deadlock under branch
#   protection. Instead the job resolves the modules, verifies sums, and uploads
#   a ready-to-apply patch. Applying it is a git-only operation:
#
#     gh run download <run-id> -n go-deps-patch   # only if the run produced a patch
#     git checkout -b chore/go-deps
#     git apply go-deps.patch
#     git commit -am "build(deps): ..." && git push
#
#   Opening a pull request from that branch triggers the full required-check
#   gate (a plain branch push triggers nothing under this repo's workflow
#   triggers). If the run reports "No dependency changes", stop here.

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Space-separated module@version specifiers, e.g. github.com/spf13/viper@v1.21.0 golang.org/x/text@latest"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: go-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve dependency bump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Follows the module's own `go` directive, so this stays correct when the
      # minimum Go version moves.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve modules
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          set -euo pipefail
          echo "go get $MODULES"
          go get $MODULES

      - name: Tidy module files
        run: go mod tidy

      - name: Verify checksums
        run: go mod verify

      - name: Produce patch
        id: patch
        run: |
          set -euo pipefail
          git diff -- go.mod go.sum > go-deps.patch
          if [ -s go-deps.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No dependency changes were produced."
          fi
          echo "--- diff stat ---"
          git diff --stat -- go.mod go.sum

      - name: Upload patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: go-deps-patch
          path: go-deps.patch
          retention-days: 7
          if-no-files-found: error

      - name: Summarize
        env:
          MODULES: ${{ inputs.modules }}
          CHANGED: ${{ steps.patch.outputs.changed }}
        run: |
          {
            echo "## go-deps run"
            echo ""
            echo "Requested: \`$MODULES\`"
            echo ""
            if [ "$CHANGED" = "true" ]; then
              echo "Apply with:"
              echo '```sh'
              echo "gh run download ${{ github.run_id }} -n go-deps-patch"
              echo "git checkout -b chore/go-deps"
              echo "git apply go-deps.patch"
              echo '```'
              echo ""
              echo '```'
              git diff --stat -- go.mod go.sum
              echo '```'
            else
              echo "No changes: the requested modules are already at the resolved versions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
