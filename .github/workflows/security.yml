name: security

# Vulnerability assessment.
#
# Disposition in this first iteration:
#   - dependency-review: BLOCKING. It only judges the PR's own dependency/action
#     changes, so it catches new vulnerable dependencies without freezing work.
#   - npm audit: BLOCKING (high/critical). 4 moderate advisories remain, all
#     dev-only via @vue/test-utils -> js-beautify -> editorconfig/glob -> minimatch;
#     they clear when @vue/test-utils updates js-beautify, so they are accepted.
#   - govulncheck: BLOCKING on reachable findings. #55 removed dockertest and
#     the last import path to the retired docker/docker module, so no vulnerability
#     is reachable from our code. Module-graph residue remains: go.sum keeps the
#     docker sums through golang-migrate's go.mod, so govulncheck still reports 4
#     module-level advisories in required-but-uncalled modules (reported, not failed).
#   - gosec / Trivy: report-only (SARIF to the Security tab); flip later.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        # setup-go v7 pins GOTOOLCHAIN=local and current govulncheck/gosec
        # releases require Go >= 1.26, so give the scanners that toolchain.
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # Blocks on any reachable finding. #55 removed dockertest and the import
      # path to docker/docker, so the previous 2 symbol-level findings are gone;
      # module-level advisories in uncalled modules are printed but do not fail.
      - name: Run govulncheck
        run: govulncheck $(go list -e ./... | grep -vE '/internal/(api|ci|auth)$')

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # Blocks on high/critical. Remaining: 4 moderate, dev-only through
      # @vue/test-utils -> js-beautify -> editorconfig/glob -> minimatch;
      # --audit-level=high exits 0.
      - name: Audit (fails on high/critical)
        run: npm audit --audit-level=high

  gosec:
    name: gosec (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec -fmt sarif -out gosec.sarif -no-fail ./...
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

  trivy-image:
    name: Trivy image scan (report-only)
    # The published image only exists after docker.yml has run on main; PR
    # image builds are not pushed, so this job is skipped on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan published api image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/porta-api:main
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan published frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/porta-frontend:main
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload api SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
      - name: Upload frontend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
