      description: |
        Requires `ea:create`. Same `multipart/form-data` shape as the validate route;
        creates the entities and returns an `ImportResult`.

        **Known limitation (partial).** Blocked by the global JSON content-type
        middleware exactly like `/ea/import/validate` and currently answers `415`.
      operationId: executeImport
      x-status: partial
      security:
