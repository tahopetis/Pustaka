  /api/v1/ea/import/validate:
    post:
      tags:
        - ea
      summary: Validate an EA import file
      description: |
        Requires `ea:create`. The handler expects `multipart/form-data` with a `file`
        part and a `ci_type` form field, parses the CSV, and returns per-row results.

        **Known limitation (partial).** The global `AllowContentType("application/json")`
        middleware runs before this handler and rejects `multipart/form-data` with
        `415`, so this route cannot currently receive its documented request.
      operationId: validateImport
      x-status: partial
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, ci_type]
              properties:
                file:
                  type: string
                  format: binary
                ci_type:
                  type: string
                  description: EA CI type name, e.g. EA.Application-BusinessApp
      responses:
        '200':
          description: Per-row validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/PlainTextBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/PlainTextUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlainTextInternalError'

