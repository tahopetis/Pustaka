      summary: Amortization summary
      description: |
        Requires `amortization:read`. `group_by` and the date range are accepted by the
        handler but currently ignored by the repository: the response always reports
        `group_by: "all"` with an empty `groups` array and totals across all amortizable
        CIs. Only the aggregate fields are meaningful here.
      operationId: getAmortizationSummaries
      x-status: partial
      security:
        - BearerAuth: []
      parameters:
        - name: group_by
          in: query
          description: Accepted but ignored (repository always groups by "all")
          schema:
            type: string
            default: ci_type
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Summarized amortization data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmortizationSummary'
        '400':
          $ref: '#/components/responses/AmortizationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/AmortizationInternalError'

  /api/v1/amortization/reports/depreciation-schedule:
    get:
      tags:
        - amortization
      summary: Depreciation schedule report
      description: |
        Requires `amortization:read`. `date_from` and `date_to` are required
        (YYYY-MM-DD). `ci_type_ids` takes a single UUID; `ci_ids` is comma-separated.
        `format=csv` switches the response to a text/csv attachment.
      operationId: generateDepreciationSchedule
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: ci_ids
          in: query
          description: Comma-separated CI UUIDs
          schema:
            type: string
        - name: ci_type_ids
          in: query
          description: Single CI type UUID
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Schedule as JSON, or CSV when format=csv
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepreciationScheduleResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/AmortizationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/AmortizationInternalError'

  /api/v1/amortization/restructuring/preview:
    post:
      tags:
        - amortization
      summary: Preview a useful-life restructuring
      description: |
        Requires `amortization:read` and `amortization:configure`. Returns the
        prospective recalculation without persisting anything.
      operationId: previewAmortizationRestructuring
      x-status: implemented
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestructuringPreviewRequest'
      responses:
        '200':
          description: Restructuring calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestructuringCalculation'
        '400':
          $ref: '#/components/responses/AmortizationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/AmortizationInternalError'

  /api/v1/amortization/restructuring:
    post:
      tags:
        - amortization
      summary: Execute a useful-life restructuring
      description: |
        Requires `amortization:read` and `amortization:configure`. `reason` is
        mandatory. Writes a restructuring ledger entry and adjusts the prospectively
        remaining depreciation.
      operationId: executeAmortizationRestructuring
      x-status: implemented
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestructureRequest'
      responses:
        '200':
          description: Restructuring result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestructureResult'
        '400':
          $ref: '#/components/responses/AmortizationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/AmortizationInternalError'

  /api/v1/amortization/settings:
    get:
      tags:
        - amortization
      summary: Get global amortization settings
      description: |
        Requires `amortization:read`.

        **Known limitation (partial).** The repository reads a hard-coded `global`
        row from an `amortization_settings` table that no migration creates, so on a
        migrated database this request fails and the handler returns `500`. The schema
        below describes the intended shape.
      operationId: getAmortizationSettings
      x-status: partial
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmortizationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/AmortizationInternalError'
    put:
      tags:
        - amortization
      summary: Update global amortization settings
      description: |
        Requires `amortization:read` and `amortization:configure`. Both fields are
        optional; omitted values fall back to the defaults `USD` and 36 months.

        **Known limitation (partial).** The write targets the `amortization_settings`
        table, which no migration creates, so on a migrated database this request
        fails and the handler returns `500`.
      operationId: updateAmortizationSettings
      x-status: partial
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAmortizationSettingsRequest'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmortizationSettings'
        '400':
          $ref: '#/components/responses/AmortizationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/AmortizationInternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token obtained from `POST /api/v1/auth/login`, sent as
        `Authorization: Bearer <token>`.

  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
        minimum: 1
    Limit:
      name: limit
      in: query
      description: Page size, capped at 100
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CiIdParam:
      name: ciId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryIdParam:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunIdParam:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchIdParam:
      name: batch_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      description: Standard JSON error body used by most handlers.
      properties:
        error:
          type: string
    AmortizationErrorResponse:
      type: object
      description: Nested error body returned by the amortization handlers.
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
            details:
              type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds (default 86400)
        user:
          $ref: '#/components/schemas/User'
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_active:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
    CreateUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        roles:
          type: array
          items:
            type: string
    UpdateUserRequest:
      type: object
      description: Accepted but currently ignored by the handler.
      properties:
        email:
          type: string
          format: email
        is_active:
          type: boolean
        roles:
          type: array
          items:
            type: string
    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer

    AttributeValidation:
      type: object
      properties:
        pattern:
          type: string
        min_length:
          type: integer
        max_length:
          type: integer
        min:
          type: integer
        max:
          type: integer
        enum:
          type: array
          items:
            type: string
        format:
          type: string
          enum: [email, url, ipv4, date, datetime]
    AttributeDefinition:
      type: object
