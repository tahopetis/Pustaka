openapi: 3.0.3
info:
  title: Porta CMDB API (partial contract)
  description: |
    **This contract is explicitly partial.** It documents only the endpoint groups that
    were verified against the live router and handlers in this repository
    (`cmd/api/main.go`, `internal/api/`, `internal/api/handlers/`). Endpoint groups that
    are not listed here are intentionally out of scope for this pass and must not be
    assumed to be covered: **graph, qr, audit, analytics, dashboard, and the public CI
    page**. Their routes exist but are incomplete as a documented contract.

    Every documented operation carries an `x-status` marker:
    - `implemented` - the route is registered and the handler matches this description.
    - `partial` - the route is registered, but a known limitation is stated in the
      operation description.
    - `planned` - the documented behaviour is not fully wired up yet.

    ## Base URL

    The API process listens on port 8080 inside its container; docker compose publishes
    it on the host as `http://localhost:8081`. All API routes are under `/api/v1`.
    `GET /health` is the only documented route outside that prefix.

    ## Authentication

    Public endpoints are only `GET /health`, `POST /api/v1/auth/login`,
    `POST /api/v1/auth/refresh`, and `GET /public/ci/{id}` (not documented here).
    Every other route requires `Authorization: Bearer <access_token>`.

    Login takes a `username` (not an email address). Default token lifetimes are 24h for
    the access token (`JWT_ACCESS_TOKEN_TTL`) and 168h for the refresh token
    (`JWT_REFRESH_TOKEN_TTL`). `POST /auth/refresh` rotates both tokens.

    Authorization is enforced by RBAC middleware keyed on permission strings seeded in
    `cmd/migrations` (for example `ci:read`, `ci:create`, `relationship_type:update`,
    `amortization:configure`, `ea:read`). The required permission chain is listed in
    each operation description. A request missing a permission returns `403`.

    ## Conventions

    - **JSON only.** The router applies `AllowContentType("application/json")` globally.
      Requests with a body must send `Content-Type: application/json`; any other media
      type is rejected with `415` before the handler runs. This also affects the
      multipart import endpoints (see their `x-status`).
    - **Pagination.** List endpoints use `page` (default 1, minimum 1) and `limit`
      (default 20, maximum 100). Page sizes are clamped by the handlers.
    - **Pagination response fields** differ per group: `page`/`limit`/`total`/
      `total_pages` for CMDB lists, `page`/`page_size`/`total_count`/`total_pages` for
      amortization, and `page`/`page_size`/`total` for EA entities.
    - **Errors.** Most handlers return `{"error": "<message>"}`. Authentication
      endpoints and the JWT/RBAC middleware return `text/plain`. Amortization returns a
      nested object: `{"error": {"message": "...", "code": "...", "details": "..."}}`.
      This is noted on the shared error responses; clients should branch on the HTTP
      status first.
    - **Request IDs.** Send `X-Request-ID` if you need correlation; the router otherwise
      generates one and echoes it as `X-Request-Id`.
    - **Not implemented.** There is no rate limiting, no Prometheus `/metrics` endpoint,
      and no Redis session store. Redis is used only for caching. Do not rely on them.

    The OpenAPI description is the machine-readable contract; `api-guide.md` covers the
    auth flow and conventions in prose, and `api-examples.md` has runnable curl recipes.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8081
    description: Host address of the docker compose API service (container port 8080)
tags:
  - name: health
    description: Liveness probe
  - name: auth
    description: Login, token refresh, current user
  - name: users
    description: User accounts and roles
  - name: ci-types
    description: CI type schemas
  - name: ci
    description: Configuration items
  - name: relationships
    description: CI relationships
  - name: relationship-types
    description: Relationship type catalogue
  - name: lifecycle-status
    description: Lifecycle status catalogue
  - name: ea
    description: Enterprise architecture entities, CI types, teams and import
  - name: ea-data-quality
    description: Enterprise architecture data quality reporting
  - name: amortization
    description: IT asset amortization
paths:
  /health:
    get:
      tags:
        - health
      summary: Liveness probe
      description: |
        Unauthenticated. The router answers directly; no database calls are made.
      operationId: getHealth
      x-status: implemented
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Log in and obtain JWTs
      description: |
        Unauthenticated. Looks the user up by **username** (the field is `username`,
        not `email`), checks `is_active`, verifies the password, and returns an access
        token and a refresh token together with the user record.

        Requires `Content-Type: application/json`. A bad body returns plain-text
        `Invalid request body`; bad credentials, an unknown user, or an inactive
        account return plain-text `401`.
      operationId: login
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/PlainTextBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/PlainTextInternalError'

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Rotate access and refresh tokens
      description: |
        Unauthenticated. Validates the supplied refresh token, reloads the user, and
        issues a new access token **and** a new refresh token. The response does not
        include the user object.
      operationId: refreshToken
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/PlainTextBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/PlainTextInternalError'

  /api/v1/me:
    get:
      tags:
        - auth
      summary: Get the current user
      description: |
        Returns the authenticated user's full record. Requires a valid JWT only; no
        additional RBAC permission is checked.
      operationId: getCurrentUser
      x-status: implemented
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users:
    get:
      tags:
        - users
      summary: List users
      description: |
        Requires `user:read`.

        `page` and `limit` are applied to the response metadata, but the underlying
        user service currently loads every user and the `search` parameter is accepted
        and ignored.
      operationId: listUsers
      x-status: partial
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - users
      summary: Create a user
      description: |
        Requires `user:read` **and** `user:create`. Roles are supplied by name and must
        already exist (`admin`, `editor`, `viewer` are seeded). A duplicate username or
        email returns plain-text `409`.
      operationId: createUser
      x-status: implemented
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}:
    get:
      tags:
        - users
      summary: Get a user
      description: Requires `user:read`.
      operationId: getUser
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - users
      summary: Update a user
      description: |
        Requires `user:read` **and** `user:update`.

        **Not implemented.** The handler decodes the body, ignores it, and returns the
        current user record unchanged. Do not rely on it changing anything.
      operationId: updateUser
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Current (unchanged) user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - users
      summary: Delete a user
      description: |
        Requires `user:read` **and** `user:delete`.

        **Not implemented.** The handler validates the ID and returns `204` without
        deleting the user.
      operationId: deleteUser
      x-status: planned
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Returned even though nothing is deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ci-types:
    get:
      tags:
        - ci-types
      summary: List CI types
      description: Requires `ci_type:read`. Supports `search` over name and description.
      operationId: listCITypes
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: CI type list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CITypeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - ci-types
      summary: Create a CI type
      description: |
        Requires `ci_type:read` and `ci_type:create`. Attribute definitions become the
        validation schema for configuration items of this type. `is_amortizable`
        enables amortization for CIs of the type. A duplicate name returns `409`.
      operationId: createCIType
      x-status: implemented
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCITypeRequest'
      responses:
        '201':
          description: Created CI type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CITypeDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ci-types/{id}:
    get:
      tags:
        - ci-types
      summary: Get a CI type
      description: Requires `ci_type:read`.
      operationId: getCIType
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: CI type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CITypeDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - ci-types
      summary: Update a CI type
      description: |
        Requires `ci_type:read` and `ci_type:update`. `name` cannot be changed; only
        description, `is_amortizable`, and the attribute schema are updated.
      operationId: updateCIType
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCITypeRequest'
      responses:
        '200':
          description: Updated CI type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CITypeDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - ci-types
      summary: Delete a CI type
      description: |
        Requires `ci_type:read` and `ci_type:delete`. Refused with `409` while CIs of
        the type exist.
      operationId: deleteCIType
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ci:
    get:
      tags:
        - ci
      summary: List configuration items
      description: |
        Requires `ci:read`.

        Filters: `ci_type`, free-text `search` (name and attributes), repeatable
        `tags`, and `created_by`. Sorting accepts `sort=name|type|created_at|updated_at`
        and `order=asc|desc` (defaults to created_at DESC).
      operationId: listCIs
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - name: ci_type
          in: query
          description: Exact CI type name
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive search over name and attributes
          schema:
            type: string
        - name: tags
          in: query
          description: Repeat the parameter for multiple tags
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: created_by
          in: query
          description: Creator user ID
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, type, created_at, updated_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: CI list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - ci
      summary: Create a configuration item
      description: |
        Requires `ci:read` and `ci:create`. `name` and `ci_type` are mandatory and
        `attributes` must validate against the CI type schema; validation failures
        return `400` with the message `Attribute validation failed` (details are logged,
        not returned in the body).
      operationId: createCI
      x-status: implemented
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCIRequest'
      responses:
        '201':
          description: Created configuration item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ci/{id}:
    get:
      tags:
        - ci
      summary: Get a configuration item
      description: Requires `ci:read`.
      operationId: getCI
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Configuration item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - ci
      summary: Update a configuration item
      description: |
        Requires `ci:read` and `ci:update`. Only `attributes`, `tags`, and
        `lifecycle_status_id` can be changed; `name` and `ci_type` are immutable.
        Attributes are re-validated against the CI type schema.
      operationId: updateCI
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCIRequest'
      responses:
        '200':
          description: Updated configuration item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - ci
      summary: Delete a configuration item
      description: |
        Requires `ci:read` and `ci:delete`. Refused with `409` while the CI still has
        relationships.
      operationId: deleteCI
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ci/{id}/relationships:
    get:
      tags:
        - ci
        - relationships
      summary: Get all relationships for a configuration item
      description: |
        Requires `relationship:read`. Returns relationships in which the CI is either
        source or target, each with the related CI embedded.

        **Known limitation (partial).** The route is registered, but this handler reads
        path parameters through the gorilla/mux helpers while the live router is chi,
        so the ID is not resolved and the endpoint currently answers `400`
        `Invalid CI ID`.
      operationId: getCIRelationships
      x-status: partial
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Relationships for the CI
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationshipGraph'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/relationships:
    get:
      tags:
        - relationships
      summary: List relationships
      description: |
        Requires `relationship:read`.

        Filters: `source_id`, `target_id`, `relationship_type`, and free-text
        `search` (matches relationship id, type, and attributes). Results are always
        ordered by creation time, newest first.
      operationId: listRelationships
      x-status: implemented
      security:
        - BearerAuth: []
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
            format: uuid
        - name: target_id
          in: query
          schema:
            type: string
            format: uuid
        - name: relationship_type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Relationship list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - relationships
      summary: Create a relationship
      description: |
        Requires `relationship:read` and `relationship:create`. Both CIs must exist
        (otherwise `404`) and self-referencing relationships are rejected with `400`.
        The relationship type is not validated against the relationship-type catalogue
        here.
      operationId: createRelationship
      x-status: implemented
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationshipRequest'
      responses:
        '201':
          description: Created relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/relationships/bulk-sources:
    post:
      tags:
        - relationships
      summary: Create relationships from many sources to one target
      description: |
        Requires `relationship:read` and `relationship:create`. Creates one
        relationship per source CI to the same target atomically. At most 50 source IDs
        are allowed and duplicates are rejected with `400`. Upstream failures are
