        message:
          type: string

  responses:
    BadRequest:
      description: |
        Invalid request. Most handlers return `{"error": "..."}`; the users handlers
        return plain text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
    PlainTextBadRequest:
      description: Invalid request, plain-text body.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: |
        Missing or invalid JWT. The JWT middleware returns plain text; some handlers
        return JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
    PlainTextUnauthorized:
      description: Authentication failed, plain-text body.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: |
        The JWT is valid but the RBAC middleware rejected the request for lack of the
        required permission. Body is plain text.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        Conflict with existing state (duplicate type name, CI with relationships).
        Most handlers return JSON; the users handler returns plain text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
    UnprocessableEntity:
      description: Critical validation failure (EA entities).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PlainTextUnprocessableEntity:
      description: CSV parsing/validation failure, plain-text body.
      content:
        text/plain:
          schema:
            type: string
    UnsupportedMediaType:
      description: |
        Rejected by the global `AllowContentType("application/json")` middleware
        because the request body was not JSON.
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: |
        Server error. Most handlers return JSON; authentication handlers and middleware
        return plain text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/plain:
          schema:
            type: string
    PlainTextInternalError:
      description: Server error, plain-text body.
      content:
        text/plain:
          schema:
            type: string
    AmortizationBadRequest:
      description: Invalid query/body or a malformed UUID (amortization nested error body).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AmortizationErrorResponse'
    AmortizationInternalError:
      description: |
        Amortization handlers map every service failure (including "not found") to
        `500`; body is the nested amortization error object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AmortizationErrorResponse'
