name: porta

services:
  postgres:
    image: postgres:15
    container_name: porta-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: porta
      POSTGRES_USER: porta
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - porta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porta -d porta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5-community
    container_name: porta-neo4j
    restart: unless-stopped
    # Conservative memory limits: heap + pagecache + JVM native overhead must
    # fit inside mem_limit. Raise these if the host has more RAM available.
    mem_limit: 1g
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7475:7474"  # HTTP
      - "7688:7687"  # Bolt
    networks:
      - porta-network
    healthcheck:
      # `cypher-shell` boots a JVM per probe (>150s on slow hosts) and cannot fit
      # in any sane timeout. Probe the Bolt listener instead: bash /dev/tcp is
      # instant, and Neo4j opens the connector only once the server is up.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  redis:
    image: redis:7-alpine
    container_name: porta-redis
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --appendonly yes --requirepass redispassword
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - porta-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    # Images are built and published by GitHub Actions (multi-arch, GHCR).
    # For a local rebuild use: docker compose -f docker-compose.yml -f docker-compose.build.yml build
    image: ghcr.io/tahopetis/porta-api:${PORTA_TAG:-main}
    container_name: porta-api
    mem_limit: 256m
    environment:
      # Database Configuration
      PORTA_DATABASE_URL: postgres://porta:password@postgres:5432/porta?sslmode=disable
      PORTA_POSTGRES_PASSWORD: password
      PORTA_POSTGRES_USER: porta
      PORTA_POSTGRES_DB: porta

      # Neo4j Configuration
      PORTA_NEO4J_URI: bolt://neo4j:7687
      PORTA_NEO4J_USERNAME: neo4j
      PORTA_NEO4J_PASSWORD: password
      PORTA_NEO4J_DATABASE: neo4j

      # Redis Configuration
      PORTA_REDIS_URL: redis://:redispassword@redis:6379
      PORTA_REDIS_PASSWORD: redispassword

      # JWT Configuration
      PORTA_JWT_SECRET: super-secret-jwt-key-change-this-in-production
      PORTA_JWT_ACCESS_TOKEN_TTL: 24h
      PORTA_JWT_REFRESH_TOKEN_TTL: 168h

      # Server Configuration
      PORTA_SERVER_HOST: 0.0.0.0
      PORTA_SERVER_PORT: 8080
      PORTA_SERVER_READ_TIMEOUT: 30s
      PORTA_SERVER_WRITE_TIMEOUT: 30s
      PORTA_SERVER_IDLE_TIMEOUT: 60s

      # CORS Configuration
      PORTA_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8080
      PORTA_CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      PORTA_CORS_ALLOWED_HEADERS: Origin,Content-Type,Accept,Authorization,X-Request-ID

      # Logging Configuration
      PORTA_LOGGING_LEVEL: info
      PORTA_LOGGING_FORMAT: json

      # Admin Configuration
      PORTA_ADMIN_USERNAME: admin
      PORTA_ADMIN_EMAIL: admin@porta.dev
      PORTA_ADMIN_PASSWORD: Admin@123

      # Environment
      PORTA_ENVIRONMENT: development
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - porta-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: ghcr.io/tahopetis/porta-frontend:${PORTA_TAG:-main}
    container_name: porta-frontend
    mem_limit: 128m
    environment:
      VITE_API_URL: /api/v1
      VITE_API_BASE_URL: /api/v1
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - porta-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  redis_data:
    driver: local

networks:
  porta-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16