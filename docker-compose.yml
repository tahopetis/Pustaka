services:
  postgres:
    image: postgres:15
    container_name: pustaka-ci-fix-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: pustaka
      POSTGRES_USER: pustaka
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pustaka-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pustaka -d pustaka"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5-community
    container_name: pustaka-ci-fix-neo4j
    restart: unless-stopped
    # Conservative memory limits: heap + pagecache + JVM native overhead must
    # fit inside mem_limit. Raise these if the host has more RAM available.
    mem_limit: 1g
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7475:7474"  # HTTP
      - "7688:7687"  # Bolt
    networks:
      - pustaka-network
    healthcheck:
      # `cypher-shell` boots a JVM per probe (>150s on slow hosts) and cannot fit
      # in any sane timeout. Probe the Bolt listener instead: bash /dev/tcp is
      # instant, and Neo4j opens the connector only once the server is up.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  redis:
    image: redis:7-alpine
    container_name: pustaka-ci-fix-redis
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --appendonly yes --requirepass redispassword
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - pustaka-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: pustaka-ci-fix-api
    mem_limit: 256m
    environment:
      # Database Configuration
      PUSTAKA_DATABASE_URL: postgres://pustaka:password@postgres:5432/pustaka?sslmode=disable
      PUSTAKA_POSTGRES_PASSWORD: password
      PUSTAKA_POSTGRES_USER: pustaka
      PUSTAKA_POSTGRES_DB: pustaka

      # Neo4j Configuration
      PUSTAKA_NEO4J_URI: bolt://neo4j:7687
      PUSTAKA_NEO4J_USERNAME: neo4j
      PUSTAKA_NEO4J_PASSWORD: password
      PUSTAKA_NEO4J_DATABASE: neo4j

      # Redis Configuration
      PUSTAKA_REDIS_URL: redis://:redispassword@redis:6379
      PUSTAKA_REDIS_PASSWORD: redispassword

      # JWT Configuration
      PUSTAKA_JWT_SECRET: super-secret-jwt-key-change-this-in-production
      PUSTAKA_JWT_ACCESS_TOKEN_TTL: 24h
      PUSTAKA_JWT_REFRESH_TOKEN_TTL: 168h

      # Server Configuration
      PUSTAKA_SERVER_HOST: 0.0.0.0
      PUSTAKA_SERVER_PORT: 8080
      PUSTAKA_SERVER_READ_TIMEOUT: 30s
      PUSTAKA_SERVER_WRITE_TIMEOUT: 30s
      PUSTAKA_SERVER_IDLE_TIMEOUT: 60s

      # CORS Configuration
      PUSTAKA_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8080
      PUSTAKA_CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      PUSTAKA_CORS_ALLOWED_HEADERS: Origin,Content-Type,Accept,Authorization,X-Request-ID

      # Logging Configuration
      PUSTAKA_LOGGING_LEVEL: info
      PUSTAKA_LOGGING_FORMAT: json

      # Admin Configuration
      PUSTAKA_ADMIN_USERNAME: admin
      PUSTAKA_ADMIN_EMAIL: admin@pustaka.dev
      PUSTAKA_ADMIN_PASSWORD: Admin@123

      # Environment
      PUSTAKA_ENVIRONMENT: development
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pustaka-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pustaka-ci-fix-frontend
    mem_limit: 128m
    environment:
      VITE_API_URL: /api/v1
      VITE_API_BASE_URL: /api/v1
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pustaka-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  redis_data:
    driver: local

networks:
  pustaka-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16